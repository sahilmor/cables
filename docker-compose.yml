version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/cablecraft?schema=public
      - DIRECT_URL=postgresql://postgres:postgres@postgres:5432/cablecraft?schema=public
      - PORT=4000
      - FRONTEND_URL=http://localhost:3000
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_samplekey123}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-sampleSecretKey456}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-webhook_secret_789}
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://mock-custom-cables.supabase.co}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-mock-anon-key}
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cablecraft
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
